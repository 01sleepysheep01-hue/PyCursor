[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pycursor"
version = "1.0.0"
description = "A small desktop coding agent with four tools and MCP support"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PyCursor" }]
dependencies = []

[project.scripts]
pycursor = "pycursor.__main__:main"
pycursor-server = "pycursor.server:cli"

[tool.setuptools.packages.find]
include = ["pycursor*"]

