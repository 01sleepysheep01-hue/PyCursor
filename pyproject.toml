[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeproof"
version = "1.7.0"
description = "A small desktop coding agent with four tools and MCP support"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CodeProof" }]
dependencies = []

[project.scripts]
codeproof = "codeproof.__main__:main"
codeproof-server = "codeproof.server:cli"
codeproof-parallel = "app.parallel:main"
codeproof-review = "app.review:main"

[tool.setuptools.packages.find]
include = ["codeproof*", "app*"]

